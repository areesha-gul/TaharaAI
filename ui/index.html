<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaharaAI RAG UI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Compliance assistant</p>
          <h1>TaharaAI</h1>
        </div>
      </header>

      <section class="panel query-panel">
        <label for="question">Ask a question</label>
        <textarea id="question" rows="4" placeholder="Example: What requirements apply to terminated employee accounts?"></textarea>
        <div class="actions">
          <button id="askButton" type="button">Search</button>
        </div>
      </section>

      <section class="panel answer-panel">
        <h2>Answer</h2>
        <div id="loading" class="hidden">Thinking…</div>
        <div id="answer" class="answer-box">Your answer will appear here.</div>
      </section>

      <section class="panel sources-panel">
        <h2>Sources</h2>
        <ul id="sources"></ul>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
